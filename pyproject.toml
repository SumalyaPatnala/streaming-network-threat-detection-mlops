[project]
name = "streaming-network-threat-detection-mlops"
version = "0.1.0"
description = "Reproducible TON_IoT network threat detection baselines"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.19,<4",
    "numpy>=1.26",
    "pandas>=2.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
