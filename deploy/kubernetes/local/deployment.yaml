apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-threat-api
  namespace: threat-detection-lab
  labels:
    app.kubernetes.io/name: network-threat-api
    app.kubernetes.io/part-of: streaming-network-threat-detection
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: network-threat-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-threat-api
        app.kubernetes.io/part-of: streaming-network-threat-detection
    spec:
      serviceAccountName: network-threat-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: streaming-threat-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: network-threat-api-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: model-artifact
              mountPath: /models/xgboost
              readOnly: true
      volumes:
        - name: model-artifact
          persistentVolumeClaim:
            claimName: network-threat-model
            readOnly: true
