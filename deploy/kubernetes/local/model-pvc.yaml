apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: network-threat-model
  namespace: threat-detection-lab
  labels:
    app.kubernetes.io/part-of: streaming-network-threat-detection
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  selector:
    matchLabels:
      model: xgboost-local
