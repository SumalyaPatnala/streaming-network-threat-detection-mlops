apiVersion: v1
kind: PersistentVolume
metadata:
  name: network-threat-model-local
  labels:
    app.kubernetes.io/part-of: streaming-network-threat-detection
    model: xgboost-local
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/host-model
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - network-threat-lab-control-plane
