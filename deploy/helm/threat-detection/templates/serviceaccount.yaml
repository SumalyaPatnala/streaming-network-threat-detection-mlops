{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "threat-detection.fullname" .) .Values.serviceAccount.name }}
  namespace: {{ include "threat-detection.namespace" . }}
  {{- if .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
