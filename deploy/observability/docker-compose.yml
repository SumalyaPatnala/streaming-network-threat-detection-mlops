services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yaml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set a local-only GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/threat-detection.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/network-threat-detection.json:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/grafana
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:
